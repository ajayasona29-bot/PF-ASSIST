<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PF ASSIST - Customer Details Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 PF ASSIST - Customer Details Store</h1>
            <p>Employee Provident Fund Customer Management System</p>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <h2>Add New Customer</h2>
            <form id="customerForm">
                <div class="form-group">
                    <label for="name">Customer Name *</label>
                    <input type="text" id="name" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="uan">UAN Number *</label>
                    <input type="text" id="uan" placeholder="Enter UAN (12 digits)" pattern="[0-9]{12}" required>
                </div>

                <div class="form-group">
                    <label for="password">UAN Password *</label>
                    <input type="password" id="password" placeholder="Enter UAN password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>

                <button type="submit" class="btn btn-primary">Add Customer</button>
            </form>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search by Name, Mobile, or UAN..." class="search-box">
            <button class="btn btn-secondary" onclick="downloadData()">📥 Download Data</button>
        </div>

        <!-- Customers Table -->
        <div class="table-section">
            <h2>Stored Customers</h2>
            <div class="table-container">
                <table id="customersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Mobile</th>
                            <th>UAN</th>
                            <th>Password</th>
                            <th>Date Added</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>
            <div id="emptyMessage" class="empty-message">No customers found. Add your first customer!</div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <h3>Total Customers</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Today's Additions</h3>
                <p id="todayCount">0</p>
            </div>
        </div>
    </div>

    <!-- Modal for View/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Customer Details</h2>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
